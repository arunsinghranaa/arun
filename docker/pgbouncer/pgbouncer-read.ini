[databases]
watchbloom = host=postgres_replica port=5432 dbname=watchbloom user=watchbloom_user

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6433
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
admin_users = watchbloom_user
stats_users = watchbloom_user

# High-concurrency Transaction Pooling for Read Queries
pool_mode = transaction
max_client_conn = 10000
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 100

# Network & Timeout optimization
server_reset_query = DISCARD ALL
server_check_query = select 1
server_check_delay = 30
query_timeout = 30
idle_transaction_timeout = 30
tcp_keepalive = 1
tcp_keepcnt = 3
tcp_keepidle = 30
tcp_keepintvl = 10

