# ==============================================================================
# Watchbloom Nginx Server Block & Route Configuration
# Supports HTTP/1.1 REST, HLS Video, HTTP/2 gRPC Ingress, and gRPC-Web Translation
# ==============================================================================

# Internal DNS resolver for dynamic Docker & Kubernetes upstream resolution
resolver 127.0.0.11 10.96.0.10 valid=10s ipv6=off;

upstream api_cluster {
    least_conn;
    server api:5000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_rate_limit:20m rate=100r/s;
limit_req_zone $binary_remote_addr zone=upload_rate_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:20m;

# ==============================================================================
# Main HTTP & gRPC-Web Gateway Server (Port 80)
# ==============================================================================
server {
    listen 80;
    server_name localhost _;

    # Maximum concurrent connections per IP
    limit_conn conn_limit 100;

    # Global security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(self)" always;
    add_header X-Request-ID $request_id always;
    proxy_set_header X-Request-ID $request_id;

    # ── HEALTH CHECK ──
    location = /healthz {
        proxy_pass http://api_cluster/healthz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # ── METRICS SCRAPE ENDPOINT ──
    location = /metrics {
        proxy_pass http://api_cluster/metrics;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
    }

    # ── STATIC ASSETS (DIRECT HIGH-SPEED SERVING) ──
    location /static/ {
        alias /var/www/watchbloom/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ── VIDEO CHUNKS & HLS SEGMENTS (.ts, .m4s) ──
    location ~* \.(ts|m4s)$ {
        proxy_pass http://api_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 206 365d;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    location ~* \.m3u8$ {
        proxy_pass http://api_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 5s;
        add_header Cache-Control "public, max-age=5, s-maxage=10";
        add_header Access-Control-Allow-Origin "*";
    }

    # ── API UPLOADS (STRICT BODY LIMITS & TIMEOUTS) ──
    location ~ ^/api/v1/(videos/upload|upload) {
        limit_req zone=upload_rate_limit burst=10 nodelay;
        proxy_pass http://api_cluster;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SERVER-SENT EVENTS (SSE) FOR LIVE STREAMING TELEMETRY ──
    location ~ ^/api/v1/live/[^/]+/events$ {
        proxy_pass http://api_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        chunked_transfer_encoding off;
    }

    # ── API APPLICATION ROUTES ──
    location /api/ {
        limit_req zone=api_rate_limit burst=200 nodelay;
        proxy_pass http://api_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── gRPC-WEB & BROWSER STREAMING RPC TRANSLATION PROXY ──
    location /watchbloom.auth.AuthService/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,x-accept-content-transfer-encoding,x-user-agent,x-grpc-web,grpc-timeout,traceparent' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Expose-Headers' 'grpc-status,grpc-message,grpc-status-details-bin,traceparent' always;

        grpc_connect_timeout 5s;
        grpc_read_timeout 60s;
        grpc_send_timeout 60s;
        grpc_socket_keepalive on;
        grpc_set_header X-Request-ID $request_id;
        grpc_set_header traceparent $http_traceparent;

        set $upstream_auth "auth:50051";
        grpc_pass grpc://$upstream_auth;
    }

    location /watchbloom.catalog.CatalogService/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,x-accept-content-transfer-encoding,x-user-agent,x-grpc-web,grpc-timeout,traceparent' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Expose-Headers' 'grpc-status,grpc-message,grpc-status-details-bin,traceparent' always;

        grpc_connect_timeout 5s;
        grpc_read_timeout 60s;
        grpc_send_timeout 60s;
        grpc_socket_keepalive on;
        grpc_set_header X-Request-ID $request_id;
        grpc_set_header traceparent $http_traceparent;

        set $upstream_catalog "catalog:50052";
        grpc_pass grpc://$upstream_catalog;
    }

    location /watchbloom.streaming.StreamingService/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,x-accept-content-transfer-encoding,x-user-agent,x-grpc-web,grpc-timeout,traceparent' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Expose-Headers' 'grpc-status,grpc-message,grpc-status-details-bin,traceparent' always;

        grpc_connect_timeout 5s;
        grpc_read_timeout 60s;
        grpc_send_timeout 60s;
        grpc_socket_keepalive on;
        grpc_set_header X-Request-ID $request_id;
        grpc_set_header traceparent $http_traceparent;

        set $upstream_streaming "streaming:50054";
        grpc_pass grpc://$upstream_streaming;
    }

    location /watchbloom.analytics.AnalyticsService/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,x-accept-content-transfer-encoding,x-user-agent,x-grpc-web,grpc-timeout,traceparent' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain charset=UTF-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Expose-Headers' 'grpc-status,grpc-message,grpc-status-details-bin,traceparent' always;

        grpc_connect_timeout 5s;
        grpc_read_timeout 60s;
        grpc_send_timeout 60s;
        grpc_socket_keepalive on;
        grpc_set_header X-Request-ID $request_id;
        grpc_set_header traceparent $http_traceparent;

        set $upstream_analytics "analytics:50055";
        grpc_pass grpc://$upstream_analytics;
    }

    location /grpc.health.v1.Health/ {
        set $upstream_health "catalog:50052";
        grpc_pass grpc://$upstream_health;
    }

    # ── ROOT SPA FRONTEND ──
    location / {
        root /var/www/watchbloom/static;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }
}

# ==============================================================================
# Dedicated HTTP/2 gRPC Ingress Gateway (Port 50050)
# ==============================================================================
server {
    listen 50050;
    http2 on;
    server_name localhost _;

    grpc_connect_timeout 5s;
    grpc_read_timeout 60s;
    grpc_send_timeout 60s;
    grpc_socket_keepalive on;
    client_body_buffer_size 1M;

    grpc_set_header X-Request-ID $request_id;
    grpc_set_header traceparent $http_traceparent;

    location /watchbloom.auth.AuthService/ {
        set $upstream_auth "auth:50051";
        grpc_pass grpc://$upstream_auth;
    }

    location /watchbloom.catalog.CatalogService/ {
        set $upstream_catalog "catalog:50052";
        grpc_pass grpc://$upstream_catalog;
    }

    location /watchbloom.streaming.StreamingService/ {
        set $upstream_streaming "streaming:50054";
        grpc_pass grpc://$upstream_streaming;
    }

    location /watchbloom.analytics.AnalyticsService/ {
        set $upstream_analytics "analytics:50055";
        grpc_pass grpc://$upstream_analytics;
    }

    location /grpc.health.v1.Health/ {
        set $upstream_health "catalog:50052";
        grpc_pass grpc://$upstream_health;
    }
}
