          <!-- Flowing Ribbon Body -->
          <rect x="-64" y="-22" width="128" height="88" rx="26" fill="url(#reelcraft-surface-grad)" stroke="url(#reelcraft-grad)" stroke-width="4.5" />
          <!-- Folded Ribbon Play Glyph Optically Centered -->
          <g transform="translate(2, 18) scale(1)">
            <path d="M -18 -18 C -18 -25, -9 -29, -2 -25 L 26 -7 C 33 -3, 33 5, 26 9 L -2 27 C -9 31, -18 27, -18 20 Z" fill="url(#reelcraft-grad)" />
            <path d="M -18 2 L 10 19 L -2 27 C -9 31, -18 27, -18 20 Z" fill="rgba(0,0,0,0.22)" />
