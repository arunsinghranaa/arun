syntax = "proto3";

package watchbloom.analytics;

service AnalyticsService {
  rpc IngestViewEvent(ViewEventRequest) returns (IngestResponse);
  rpc IngestQoETelemetry(QoETelemetryRequest) returns (IngestResponse);
  rpc GetRealtimeMetrics(MetricsRequest) returns (RealtimeMetricsResponse);
}

message ViewEventRequest {
  string item_id = 1;
  string visitor_id = 2;
  double playback_time_s = 3;
}

message QoETelemetryRequest {
  string item_id = 1;
  string visitor_id = 2;
  double buffer_ratio = 3;
  double latency_ms = 4;
  string cdn_node = 5;
}

message IngestResponse {
  bool success = 1;
  string stream_id = 2;
}

message MetricsRequest {
  int32 window_seconds = 1;
}

message TrendingVideo {
  string item_id = 1;
  int64 recent_views = 2;
}

message RealtimeMetricsResponse {
  int32 window_seconds = 1;
  int64 total_active_viewers = 2;
  repeated TrendingVideo trending_videos = 3;
  map<string, double> cdn_latency_ms = 4;
}

