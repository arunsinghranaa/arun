apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchbloom-celery-worker
  namespace: watchbloom
  labels:
    app.kubernetes.io/name: watchbloom
    app.kubernetes.io/component: celery-worker
spec:
  replicas: 4
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: watchbloom
      app.kubernetes.io/component: celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: watchbloom
        app.kubernetes.io/component: celery-worker
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: watchbloom/worker:latest
          imagePullPolicy: IfNotPresent
          command:
            - /entrypoint.sh
            - celery
            - -A
            - core.tasks.celery_app
            - worker
            - --loglevel=info
            - -Q
            - celery,transcode_video,buffer_flush
            - -c
            - "4"
          envFrom:
            - configMapRef:
                name: watchbloom-config
            - secretRef:
                name: watchbloom-secret
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2500m
              memory: 4Gi
          volumeMounts:
            - name: transcode-scratch
              mountPath: /tmp/watchbloom_transcode
      volumes:
        - name: transcode-scratch
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi

