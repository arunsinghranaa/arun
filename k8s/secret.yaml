  name: watchbloom-secret
  namespace: watchbloom
  labels:
    app.kubernetes.io/name: watchbloom
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  SECRET_KEY: "prod-watchbloom-high-entropy-secret-key-32chars"
