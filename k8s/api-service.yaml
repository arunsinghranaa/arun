apiVersion: v1
kind: Service
metadata:
  name: watchbloom-api
  namespace: watchbloom
  labels:
    app.kubernetes.io/name: watchbloom
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: watchbloom
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
    - name: metrics
      port: 9102
      targetPort: 5000
      protocol: TCP

