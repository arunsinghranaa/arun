apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: watchbloom-api-monitor
  namespace: watchbloom
  labels:
    app.kubernetes.io/name: watchbloom
    app.kubernetes.io/component: metrics
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: watchbloom
      app.kubernetes.io/component: api
  endpoints:
    - port: metrics
      path: /metrics
      interval: 10s
      scrapeTimeout: 5s

