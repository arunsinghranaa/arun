apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: watchbloom

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - redis.yaml
  - pgbouncer.yaml
  - api-deployment.yaml
  - api-service.yaml
  - hpa-api.yaml
  - celery-worker-deployment.yaml
  - keda-scaledobject-worker.yaml
  - celery-beat-deployment.yaml
  - ingress.yaml
  - servicemonitor.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: watchbloom-platform
      environment: production
