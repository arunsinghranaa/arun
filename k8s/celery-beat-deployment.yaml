apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchbloom-celery-beat
  namespace: watchbloom
  labels:
    app.kubernetes.io/name: watchbloom
    app.kubernetes.io/component: celery-beat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: watchbloom
      app.kubernetes.io/component: celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: watchbloom
        app.kubernetes.io/component: celery-beat
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: beat
          image: watchbloom/beat:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - core.tasks.celery_app
            - beat
            - --loglevel=info
            - -s
            - /tmp/celerybeat-schedule
          envFrom:
            - configMapRef:
                name: watchbloom-config
            - secretRef:
                name: watchbloom-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

