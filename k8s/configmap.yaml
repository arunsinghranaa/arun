apiVersion: v1
kind: ConfigMap
metadata:
  name: watchbloom-config
  namespace: watchbloom
  labels:
    app.kubernetes.io/name: watchbloom
    app.kubernetes.io/component: configuration
data:
  FLASK_ENV: "production"
  PORT: "5000"
  GUNICORN_WORKERS: "4"
  GUNICORN_THREADS: "4"
  CACHE_DEFAULT_TTL: "300"
  MAX_CONTENT_LENGTH: "262144000" # 250 MB
  
  # Redis Cluster / Sentinel / Master Service
  REDIS_URL: "redis://watchbloom-redis:6379/0"
  CELERY_BROKER_URL: "redis://watchbloom-redis:6379/1"
  CELERY_RESULT_BACKEND: "redis://watchbloom-redis:6379/2"

  # PgBouncer Connection Pools
  DATABASE_URL: "postgresql://watchbloom_user:watchbloom_secure_password_replace_in_prod@watchbloom-pgbouncer-write:6432/watchbloom"
  DATABASE_READ_URLS: "postgresql://watchbloom_user:watchbloom_secure_password_replace_in_prod@watchbloom-pgbouncer-read:6433/watchbloom"

  # Cloudflare CDN & Edge Routing
  CDN_BASE_URL: "https://media.watchbloom.com"
  R2_BUCKET_NAME: "watchbloom-media"
  R2_ENDPOINT_URL: "https://auto.r2.cloudflarestorage.com"
  
  # CORS Origins
  CORS_ALLOWED_ORIGINS: "https://watchbloom.com,https://www.watchbloom.com,https://app.watchbloom.com"
  
  # Monitoring & Log Levels
  LOG_LEVEL: "INFO"
  ENABLE_PROMETHEUS: "true"

