apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app.kubernetes.io/name: watchbloom-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: transcode-worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      app.kubernetes.io/name: watchbloom-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: watchbloom-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: celery-worker
          image: "{{ .Values.workerImage.repository }}:{{ .Values.workerImage.tag }}"
          imagePullPolicy: {{ .Values.workerImage.pullPolicy }}
          command:
            - celery
            - -A
            - core.tasks.celery_app
            - worker
            - --loglevel=info
            - -c
            - "4"
          env:
            - name: WATCHBLOOM_ENV
              value: {{ .Values.global.environment | quote }}
            - name: CELERY_BROKER_URL
              value: "redis://{{ .Values.redis.host }}:{{ .Values.redis.port }}/0"
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}

